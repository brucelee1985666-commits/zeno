name: Zeno Neural Volume Dataset Checks

on:
  push:
    branches:
      - zeno-master-clean-copy
  pull_request:
    branches:
      - master
    paths:
      - "projects/zenvdb/**"
      - "tools/neural_volume/**"
      - ".github/workflows/neural-volume-dataset.yml"

jobs:
  znvds-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check neural trainer syntax
        run: python -m py_compile tools/neural_volume/inspect_znvds.py tools/neural_volume/inspect_znvm.py tools/neural_volume/train_znvds.py
      - name: Build and test C++ ZNVM reader
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iprojects/zenvdb/include \
            projects/zenvdb/NeuralVolumeModel.cpp \
            tools/neural_volume/znvm_reader_test.cpp \
            -o znvm-reader-test
          ./znvm-reader-test
      - name: Validate ZNVDS parser
        run: python -m unittest discover -s tools/neural_volume -p "test_*.py" -v

  cuda-compile:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu22.04
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git g++ ca-certificates
      - name: Checkout
        uses: actions/checkout@v4
      - name: Mark checkout safe for containerized Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fetch pinned NanoVDB headers
        run: git submodule update --init projects/zenvdb/nanovdb-upstream
      - name: Fetch pinned tiny-cuda-nn headers
        run: |
          git clone https://github.com/NVlabs/tiny-cuda-nn.git /tmp/tiny-cuda-nn
          git -C /tmp/tiny-cuda-nn checkout 3daa6e5b8b8e0fa17971a1a20acfbb3754494b38
      - name: Compile CUDA neural volume bridge (compile-only, no GPU required)
        run: |
          nvcc --version
          nvcc -std=c++17 -arch=sm_75 --expt-relaxed-constexpr --extended-lambda -Xcompiler=-fPIC \
            -DZENO_WITH_TINY_CUDA_NN=1 \
            -DZENO_WITH_NANOVDB_CUDA_BUILDERS=1 \
            -DTCNN_MIN_GPU_ARCH=75 \
            -Iprojects/zenvdb/include \
            -Iprojects/zenvdb/nanovdb-upstream/nanovdb \
            -I/tmp/tiny-cuda-nn/include \
            -I/tmp/tiny-cuda-nn/dependencies \
            -c projects/zenvdb/TinyCudaNNRuntime.cu \
            -o /tmp/TinyCudaNNRuntime.o

  nanovdb-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch pinned OpenVDB submodule
        run: git submodule update --init projects/zenvdb/openvdb
      - name: Install OpenVDB header dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtbb-dev libblosc-dev zlib1g-dev libboost-iostreams-dev libimath-dev
      - name: Configure pinned OpenVDB headers
        run: |
          cmake -S projects/zenvdb/openvdb -B build-openvdb \
            -DOPENVDB_BUILD_BINARIES=OFF \
            -DOPENVDB_BUILD_UNITTESTS=OFF \
            -DOPENVDB_BUILD_PYTHON_MODULE=OFF \
            -DOPENVDB_BUILD_NANOVDB=OFF \
            -DUSE_NANOVDB=OFF \
            -DUSE_EXR=OFF \
            -DUSE_IMATH_HALF=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Compile NanoVDB conversion API smoke
        run: |
          VERSION_HEADER=$(find build-openvdb -name version.h -print -quit)
          if [ -z "$VERSION_HEADER" ]; then
            echo "OpenVDB CMake did not generate version.h"
            exit 1
          fi
          VERSION_INCLUDE_DIR=$(dirname "$VERSION_HEADER")
          VERSION_PARENT_DIR=$(dirname "$VERSION_INCLUDE_DIR")
          g++ -std=c++17 -fsyntax-only \
            -I"$VERSION_INCLUDE_DIR" \
            -I"$VERSION_PARENT_DIR" \
            -Iprojects/zenvdb/openvdb/openvdb \
            -Iprojects/zenvdb/openvdb/nanovdb \
            tools/neural_volume/nanovdb_api_smoke.cpp

      - name: Fetch pinned upstream NanoVDB headers
        run: git submodule update --init projects/zenvdb/nanovdb-upstream
      - name: Compile and run native active-tile topology smoke
        run: |
          g++ -std=c++17 -pthread -Wall -Wextra -Werror \
            -isystem projects/zenvdb/nanovdb-upstream/nanovdb \
            tools/neural_volume/nanovdb_native_tiles_smoke.cpp \
            -o nanovdb-native-tiles-smoke
          ./nanovdb-native-tiles-smoke

      - name: Compile and run CPU NanoVDB FloatGrid reference
        run: |
          g++ -std=c++17 -pthread -Wall -Wextra -Werror \
            -isystem projects/zenvdb/nanovdb-upstream/nanovdb \
            tools/neural_volume/nanovdb_cpu_reference_smoke.cpp \
            -o nanovdb-cpu-reference-smoke
          ./nanovdb-cpu-reference-smoke

      - name: Compile and run end-to-end ZNVDS to NanoVDB CPU round-trip
        run: |
          g++ -std=c++17 -pthread -Wall -Wextra -Werror \
            -isystem projects/zenvdb/nanovdb-upstream/nanovdb \
            tools/neural_volume/znvds_to_nanovdb.cpp \
            tools/neural_volume/znvds_to_nanovdb_smoke.cpp \
            -o znvds-to-nanovdb-smoke
          ./znvds-to-nanovdb-smoke
      - name: Compile standalone ZNVDS to NanoVDB converter
        run: |
          g++ -std=c++17 -pthread -Wall -Wextra -Werror \
            -isystem projects/zenvdb/nanovdb-upstream/nanovdb \
            tools/neural_volume/znvds_to_nanovdb.cpp \
            tools/neural_volume/znvds_to_nanovdb_main.cpp \
            -o znvds-to-nanovdb

      - name: Build and run real OpenVDB FloatGrid to ZNVDS to NanoVDB disk round-trip
        run: |
          cmake -S tools/neural_volume/openvdb_roundtrip -B build-openvdb-floatgrid \
            -DOPENVDB_SOURCE_DIR="$GITHUB_WORKSPACE/projects/zenvdb/openvdb" \
            -DNANOVDB_INCLUDE_DIR="$GITHUB_WORKSPACE/projects/zenvdb/nanovdb-upstream/nanovdb"
          cmake --build build-openvdb-floatgrid --target openvdb-floatgrid-roundtrip-smoke -j2
          ./build-openvdb-floatgrid/openvdb-floatgrid-roundtrip-smoke

      - name: Compile Zeno ZNVDS conversion node against real Zeno headers
        run: |
          g++ -std=c++17 -Wno-deprecated-declarations -fsyntax-only \
            -Izeno/include \
            -Iprojects/zenvdb/include \
            -Iprojects/oldzenbase/include \
            -Itools/neural_volume \
            -isystem projects/zenvdb/nanovdb-upstream/nanovdb \
            projects/zenvdb/ZNVDSFileToNanoVDB.cpp
