name: Zeno Neural Volume Dataset Checks

on:
  push:
    branches:
      - zeno-master-clean-copy
  pull_request:
    branches:
      - master
    paths:
      - "projects/zenvdb/**"
      - "tools/neural_volume/**"
      - ".github/workflows/neural-volume-dataset.yml"

jobs:
  znvds-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate ZNVDS parser
        run: python -m unittest discover -s tools/neural_volume -p "test_*.py" -v
